    content: |-
      #### 盤古開天闢地，炎黃創建華夏，
      千年文史，匯於食飲，
      灶上的火，是廚師的神與靈，
      兩把主宰著色香味的火，是為「炎」；
      佳餚飄香，傳遍天下，
      以樓聚友，是 炎香樓。\
      \
      \
      \
      一席粵味，承載一份對美好的講究

      一席好菜，從來不只是味道。

      它是對食材的尊重，是一門手藝的傳承，也是人與人相聚時，那份無可取代的溫度。

      炎香樓，從粵菜出發。

      2017年1月21日，炎香樓重裝登場，由世界廚神陳偉強領軍五星級主廚團隊，將對粵菜的深厚底蘊與現代料理的創意巧思，匯聚於一席之間。

      我們講究食材本身的鮮美，也重視火候、技法與味道之間的平衡。從傳統粵菜，精緻特色功夫菜，讓熟悉的粵味在不同時代裡持續展現新的風貌。

      因為我們相信，經典之所以能夠流傳，不是因為它停留在過去，而是因為始終有人願意用心守護，也願意不斷探索。
