intro:
  heading: 媒體報導
  body: "**透過鏡頭走進炎香樓，從料理現場與主廚手藝，到餐桌之外的每一段精彩故事；透過重要活動、名廚交流與品牌企劃，細細收藏一路走來的每個重要時刻。讓影\
    像與文字留下足跡，也讓更多人從不同角度，看見炎香樓對料理的堅持與對美好的追求。**"
