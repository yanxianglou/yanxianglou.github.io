title: "22222"
bio: >
  由世界廚神陳偉強領軍五星級主廚團隊，巨獻【炎香樓】於2017年元月21日重裝登場，
  餐點涵蓋主廚私房頂級料理、粵式風味美饌、手作精緻港點及創意甜品，完整呈現粵菜飲食風華，
  最特別是引進全台第一座大轉輪蒸籠，直徑超過1米的巨型蒸籠，可涵納各種生猛活海鮮、山產鮮蔬、珍味港點等，
  當蒸好的蒸籠鍋蓋一掀開，滿坑滿谷鮮味佳餚，絕對讓您大開眼界。 【炎香樓】整體融合中式古典與現代之美，一樓為4~10人客席(約42座席)，
  二樓則有3間獨立包廂(全開約55座席)，提供10人以上桌宴聚會並接受客製餐宴， 無論是宴請貴賓、商務聚餐或家族聚會皆為最佳首選。
