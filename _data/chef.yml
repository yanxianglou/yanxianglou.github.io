name: "2222222222"
title: 以粵菜傳承匠心，添香、添味，更添相聚情意
bio: >-
  由世界廚神陳偉強領軍五星級主廚團隊，炎香樓於2017年元月21日重裝登場，匯聚主廚私房頂級料理與經典粵式風味，細膩呈現粵菜的飲食風華。


  炎香樓引進全台首座大轉輪蒸籠，直徑超過1米，可容納生猛海鮮、山產鮮蔬與珍味美饌。

  蒸籠揭蓋瞬間，鮮香四溢，豪氣佳餚盡現眼前，帶來兼具視覺與味覺的饗宴。


  空間融合中式古典與現代雅緻，一樓提供4至10人客席，二樓設有三間獨立包廂，適合10人以上宴席並提供客製餐宴。無論宴請貴賓、商務聚餐或家族團聚，皆是品味粵菜、款待重要之人的理想之選。
