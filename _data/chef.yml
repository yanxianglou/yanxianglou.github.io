name: "2222222222"
title: 以粵菜傳承匠心，添香、添味，更添相聚情意
bio: >-
  由世界廚神陳偉強領軍五星級主廚團隊，炎香樓自 2017 年於台中西區重裝登場，匯聚主廚私房頂級料理與經典粵菜風味，細膩演繹台中中菜餐廳的當代風華。


  ▌ 鎮店招牌：全台首座大轉輪蒸籠「巨籠宴」與「片皮鴨」

  引進直徑超過 1 米的巨型蒸籠，打造獨家「巨籠宴」與適合小家庭的「小巨籠」，一次囊括生猛海鮮、山產鮮蔬與山珍海味，蒸籠揭蓋瞬間鮮香四溢，成為台中海鮮聚餐與台中美食版圖中的指標饗宴；搭配皮脆肉嫩的招牌片皮鴨與精緻港點，滿足老饕對頂級中菜的期待。


  ▌ 彈性空間規劃：從 4 人小聚到獨立包廂桌宴

  空間融合中式古典與現代雅緻，滿足多元台中聚餐推薦需求：


  一樓開放客席（4–10 人）： 適合台中4人聚餐、家庭聚餐與朋友聚餐，輕鬆品嚐單點與精緻套餐。


  二樓獨立包廂（10 人以上）： 設有三間獨立包廂，提供高度隱私與客製化合菜桌宴，是商務宴客、公司聚餐、台中尾牙推薦與台中春酒推薦的理想場地。


  ▌ 節慶團圓首選：除夕圍爐與外帶年菜宅配

  每逢新春佳節，炎香樓亦推出澎湃台中圍爐宴與多款台中年菜組合，提供年菜預購、外帶年菜與年菜外送服務，讓您在餐廳或家中都能輕鬆享用五星級台中年夜飯與團圓飯。
