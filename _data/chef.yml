name: "2222222222"
title: 以粵菜傳承匠心，添香、添味，更添相聚情意
bio: >-
  坐落於台中西區的炎香樓，由世界廚神陳偉強領軍五星級主廚團隊，自 2017
  年重裝登場以來，致力呈現道地台中粵菜與精緻中菜餐廳的飲食風華。我們匯聚主廚私房料理、經典港點與招牌片皮鴨，將傳統工藝化為餐桌上的細膩美學。


  作為極具特色的台中海鮮餐廳，炎香樓引進全台首座直徑超過 1 米的大轉輪蒸籠，推出震撼視覺與味覺的「巨籠宴」與「小巨籠」。嚴選生猛海鮮、山產鮮蔬與珍味美饌，蒸籠揭蓋瞬間鮮香四溢，為台中海鮮聚餐帶來豪氣十足的感官饗宴。


  店內空間融合中式古典與現代雅緻，一樓設有 4 至 10 人舒適客席，二樓規劃三間獨立包廂餐廳空間，適合 10 人以上合菜桌宴並提供客製化菜單。無論是家庭聚餐、朋友聚餐、公司聚餐、尾牙春酒，或是歲末年初的台中年菜預購、外帶年菜與除夕圍爐年夜飯，炎香樓皆是款待重要之人的台中聚餐推薦首選。
