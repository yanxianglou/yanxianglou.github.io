statement:
  heading_line1: 炎起鑊香，樓外有情
  heading_line2: 以一席好宴款待知己
  body: |-
    一席小聚，亦可盛情；經典粵味，亦能專屬訂製。
    以澎湃鑊氣淬鍊風味，讓每一道菜，都為相聚添香；量身規劃專屬宴席，讓每一席，都恰如其分地成就重要時刻。
  cta_text: 立即專人洽詢
  cta_link: https://page.line.me/mew1122i?oat_content=url&openQrModal=true
faq:
  - question: 有提供港式飲茶點心嗎？
    answer: 未提供港式飲茶點心，本店主打傳統粵菜，提供精緻特色功夫菜、單點（約4–5人份）、宴客桌菜與客製專屬桌宴（ 提前3–5天預約  )。
  - question: 有包廂可以使用嗎？
    answer: 本店設有獨立包廂，適合商務宴請、家族聚會及各式重要慶祝場合，提供更自在、私密的用餐空間。包廂席次有限，建議提前預約，以利安排。
  - question: 私人訂製桌宴該怎麼安排？
    answer: 訂製桌宴採預約制，需提前3–5天預約，可依宴請需求、人數及預算量身規劃，由專人為您搭配合適菜色與桌宴組合。
  - question: 巨籠桌宴適合幾人享用？
    answer: 巨籠桌宴最低訂餐量為 10 人份，用餐人數較多可加量、加價。歡迎預訂時告知用餐人數，我們將為您建議合適的桌宴安排。
