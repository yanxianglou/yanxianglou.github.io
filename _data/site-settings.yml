faq:
  - question: 私人訂製的每人低消是多少？
    answer: 每人低消高於平日午間套餐，確切金額請洽訂位人員。
  - question: 隱藏版菜單最少要幾人？
    answer: 僅開放6人以上訂席，恕無法接受6人以下訂位。
  - question: 午間套餐跟私人訂製差在哪？
    answer: 供應時段與低消不同，午間限平日中午，私人訂製全時段可約。
