dishes:
  - name: 順德生滾龍虎魚湯
    subtitle: 龍虎魚肉細嫩鮮美，湯頭濃醇鮮甜、膠質豐盈，入口滑順甘潤，每一口都是滿滿鮮味。
    images:
      - src: /assets/img/uploads/image_s順德生滾龍虎魚湯-1-hot.png
        name: ""
        subtitle: ""
      - src: /assets/img/uploads/image_s蜜瓜爵士湯.png
        name: 蜜瓜爵士湯(預訂)
        subtitle: 蜜瓜清甜交融鮮醇湯香，經10–12小時細火慢燉，湯韻清潤甘甜、層次細膩，盡顯匠心慢熬的極致鮮美！
      - src: /assets/img/uploads/image_s雲吞濃雞湯hot.png
        name: 雲吞濃雞湯
        subtitle: 濃醇雞湯慢熬鮮香，手工雲吞飽滿，口口溫潤。
  - name: 炎香燒鵝三吃(預訂)
    subtitle: 脆皮鵝肉果香馥郁、外酥內嫩，鵝腿肉鮮嫩多汁，搭配鵝丁鍋飯鑊氣濃香、粒粒入味，鵝肉的豐腴鮮香在口中層層綻放。
    images:
      - src: /assets/img/uploads/image_s燒鵝三吃-2-.png
        name: ""
        subtitle: ""
      - src: /assets/img/uploads/image_s炎香御藏叉燒.png
        name: 炎香御藏叉燒
        subtitle: 每隻豬僅取兩塊珍稀精華部位，油花豐潤、肉質柔嫩，裹上秘製醬汁炙燒，焦香四溢、鹹香回甘！
      - src: /assets/img/uploads/lmage_s川椒牛小排hot.png
        name: 川椒牛小排
        subtitle: 花椒麻香馥郁，牛小排大火煸炒，鮮嫩多汁。
  - name: 冰玉南非鮑(私人訂製)
    subtitle: 鮑魚厚實Q彈、酒香醇厚迷人，佐以檸檬冰沙提味解膩，酸香清爽、層次豐富，堪稱宴席上最吸睛的精緻佳餚！
    images:
      - src: /assets/img/uploads/image_s冰玉南非鮑.png
      - src: /assets/img/uploads/image_s金湯奶油蝦-小饅頭-1-.png
        name: 金湯奶油蝦+小饅頭
        subtitle: 奶油金湯濃醇、香氣馥郁，鮮蝦飽滿、彈嫩鮮甜，小饅頭輕沾金黃湯汁，入口吸飽濃香，每一口都令人吮指回味！
      - src: /assets/img/uploads/image_s避風塘軟殼蟹hot.png
        name: 避風塘軟殼蟹
        subtitle: 蒜酥香氣馥郁，軟殼蟹連殼酥脆甜，越嚼越香。
  - name: 清爽果絲鴨(私人訂製)
    subtitle: 細緻鴨絲酥炸，拌入雙果泥與洋蔥，酥香果酸交織，多重口感、清新不膩。
    images:
      - src: /assets/img/uploads/image_s清爽果絲鴨.png
      - src: /assets/img/uploads/lmage_s黑蒜炒波龍hot-1-.png
        name: 黑蒜炒波龍
        subtitle: 黑蒜慢釀醇厚甘香，層層襯托波龍鮮甜，蝦肉飽滿彈嫩、鮮香四溢，濃郁蒜香與海味交織，入口鮮美醇厚。
      - src: /assets/img/uploads/image_s鮑韻松露燒烏雞.png
        name: 鮑韻松露燒烏雞(私人訂製)
        subtitle: 薄脆外皮鎖住烏雞鮮嫩肉汁，鮑魚厚實Q彈、鮮味飽滿，佐以松露馥郁香氣層層縈繞，繁複工序淬鍊而成的極致功夫菜。
  - name: 火焰脆皮雞(預訂)
    subtitle: 高粱烈焰炙燒出誘人焦香，雞皮酥脆、雞油香氣濃郁，淋上香醇雞油拌飯更添風味，鹹香涮嘴。
    images:
      - src: /assets/img/uploads/s火焰脆皮雞.jpg
      - src: /assets/img/uploads/image_s西施龍皇泡飯1.png
        name: 西施龍皇泡飯
        subtitle: 金黃炸米遇上鮮醇龍皇湯， 一沖、一泡，海味與米香瞬間交融。
      - src: /assets/img/uploads/image_s冰封鵝肝玉雪-1-.png
        name: 冰封鵝肝玉雪(私人訂製)
        subtitle: 冰霜般絲滑鵝肝，揉入白蘭地酒香，酥脆甜筒相襯。
  - name: 沙母蚧炒糯米飯(私人訂製)
    subtitle: 蟹膏鮮香層層入米，鑊氣十足、粒粒糯米飽吸濃郁蟹鮮，亞洲御廚曾鏡雄師傅的招牌功夫菜。
    images:
      - src: /assets/img/uploads/image_s沙母蚧炒糯米飯hot.png
        name: ""
        subtitle: ""
      - src: /assets/img/uploads/image_三臘聚香飯.png
        name: 三臘聚香飯(私人訂製)
        subtitle: 淋上秘製臘味醬汁，臘香、醬香、米香與蔥香層層綻放。
      - src: /assets/img/uploads/image_s黑鑽鴨皮叉燒-cut.png
        name: 黑鑽鴨皮叉燒(私人訂製)
        subtitle: 鴨皮焦香酥脆，叉燒柔嫩豐腴，一口盡享雙重風味。
