page_title: 常見問題
intro: 私人訂製、訂位須知及常見問題一次整理，讓您輕鬆掌握用餐安排
categories:
  - name: 訂位與用餐
    questions:
      - question: 用餐需要事先訂位嗎？
        answer: 單點用餐建議提前訂位，以利座位安排；巨籠桌宴及私人訂製桌宴採預約制，建議至少提前3-5天聯繫。大型聚會、節慶或有特殊餐飲需求，建議提早預訂。
      - question: 訂位需要付訂金嗎？可以取消或改期嗎？
        answer: |
          訂位皆需酌收訂金：外區座席3-5 位為 NT$2,000、6位以上為 NT$3,000；包廂席間每桌NT$10,000。

          取消、改期及訂金退還規範將依預訂日期與訂席內容辦理，建議訂位時向服務人員確認相關規則，以保障您的權益。
      - question: 有低消或服務費嗎？
        answer: 外區座席無低消限制；包廂桌席設有低消限制，內用體驗另加 10% 服務費。
      - question: 有包廂可以使用嗎？
        answer: 本店設有獨立包廂，適合商務宴請、家族聚會及各式重要慶祝場合，提供更自在、私密的用餐空間。包廂席次有限，建議提前預約，以利安排。
      - answer: 為維護所有賓客的用餐品質、餐廳環境及食品衛生，本餐廳全面禁止寵物進入店內，恕無法攜帶犬、貓及其他寵物入內用餐。
        question: 可以攜帶寵物入店嗎?
  - name: 餐點與飲食
    questions:
      - question: 有提供港式飲茶點心、港點吃到飽嗎？
        answer: 目前未提供港式飲茶點心，本店主打傳統粵菜，提供精緻單點(約4–5人份)、特色功夫菜及宴客桌菜；另可依您預算與人數，量身訂製專屬桌宴。私人訂製桌宴需提前3-5天預約。
      - question: 有提供素食餐點嗎？有哪些選擇？
        answer: 有的，本店提供方便素餐點，包含素食套餐（NT$1,500/套）及素食單點菜色（約4人份）。若有素食需求，歡迎於訂位時提前告知，我們將為您推薦合適的餐點。
      - question: 對海鮮、堅果或其他食材過敏，可以調整菜色嗎？
        answer: |
          可以。請於訂位或點餐前告知過敏食材，我們會盡力協助調整或替換菜色。若預訂巨籠桌宴或私人訂製桌宴，建議提前告知，以利餐點安排。

          提醒您：餐點製作環境仍可能接觸海鮮、堅果及其他過敏原；若有嚴重過敏情況，建議訂位時先與服務人員確認。
      - question: 午間有商務套餐嗎？適合幾位用餐？
        answer: 平日午間限定提供雙人商務套餐(NT$1,680)，實際套餐內容以現場公告或訂位確認為準，建議提前預約，以利安排。
      - question: 可以自備蛋糕慶生嗎？會收取費用嗎？
        answer: 可以，歡迎自備蛋糕及餐具慶祝，店內不另收蛋糕切盤費；相關清潔費用亦不另行收取。
  - name: 桌宴與私人訂製
    questions:
      - question: 巨籠桌宴適合幾人享用？
        answer: 巨籠桌宴最低訂餐量為 10 人份，用餐人數較多可加量、加價。歡迎預訂時告知用餐人數，我們將為您建議合適的桌宴安排。
      - question: 私人訂製桌宴該怎麼安排？
        answer: 訂製桌宴採預約制，需提前3–5天預約，可依用餐人數、預算及宴請目的量身規劃。可依設宴需求，如商務宴請、家族聚會、慶生或節慶聚餐，我們將由專人為您規劃合適的菜色與桌宴組合。
      - question: 私人訂製桌宴有人數、桌數限制嗎？
        answer: 私人訂製桌宴可依用餐人數、預算與需求彈性規劃，樓面最大容納約60位，實際安排將依場地、包廂及當日廚房產能協調，歡迎提前與我們討論。
  - name: 交通與停車
    questions:
      - question: 附近有停車場嗎？有停車優惠嗎？
        answer: 本店特約停車場為「東興立體停車場」，可享2小時停車折抵優惠，現場亦有泊車協助服務。離席前請至櫃檯填寫資料並領取停車折抵券，即可享停車優惠。
  - name: 會員申辦與查詢
    questions:
      - question: 如何成為炎香樓會員？
        answer: 歡迎加入炎香樓會員！您可於店內洽詢服務人員，或加入炎香樓官方 LINE 完成會員綁定。成功申辦後，即可透過 LINE
          連結會員帳戶，隨時查詢累積點數與專屬優惠券，輕鬆掌握會員禮遇！
      - question: 加入會員需要付費嗎？
        answer: 申辦會員後，於門市消費滿500元即可累積1點點數。
      - answer: 會員可依餐廳公告享有各項專屬禮遇，包括新會員禮、壽星加菜禮、會員升級禮、好友分享禮及集點兌換禮等，實際內容與適用條件以當期公告為準。
        question: 加入會員後可以享有哪些優惠？
      - question: 炎香樓有提供壽星生日優惠嗎？
        answer: 申辦會員即享有當月壽星加菜禮券，建議您於訂位或用餐前先行洽詢，讓炎香樓有機會為您的生日餐敘增添一份心意。
      - question: 如何查詢目前累積的會員點數？
        answer: 提供註冊時使用電話，即可查詢帳戶資訊。亦可透過官方LINE 連結會員帳戶，隨時查詢累積點數與專屬優惠券，輕鬆掌握會員禮遇！
      - question: 會員點數有使用期限嗎？
        answer: 會員點數之有效期限依會員系統說明辦法為準，建議您定期確認點數餘額及效期，並於期限內完成兌換。
      - question: 忘記出示會員資料，結帳後還可以補登點數嗎？
        answer: A：可以，若您於消費時忘記出示會員，請於當日營業時間內至現場辦理補登，逾時恕不受理。為避免錯過累積點數的機會，貼心提醒您，下次用餐時別忘了先出示會員資料喔！
      - answer: 目前會員點數尚未開放合併或轉贈，還請您見諒！建議您使用自己的會員帳號累積點數，讓每一次來炎香樓用餐的美好時光，都能累積專屬於您的會員回饋。
        question: 不同會員帳號的點數可以合併嗎？
