info:
  heading: 客製化宴席，量身而定
  body: >-
    當一頓飯，必須代表您的心意。

    無論是商務宴請重要客戶、長輩壽宴、慶生聚餐，或是溫馨的訂婚家宴，炎香樓提供台中西區隱密獨立包廂與專屬客製化合菜桌宴。


    以道地粵式桌菜工藝為底蘊，由主廚依宴席規格精心搭配——從前菜、海陸主菜、滋補湯品到精緻甜點，層層鋪陳，道道講究火候與擺盤。無需費心張羅，只需從容待客；讓每一道菜都成為款待賓客的心意，將體面、講究與情誼，一席之間悉數呈現。
  cta_text: 宴席洽詢
  cta_link: https://lin.ee/T8JM4Q8
