info:
  heading: 客製化宴席，量身而定
  body: >-
    當一頓飯，必須代表您的心意。


    無論是宴請重要客戶、家族長輩壽宴，或是朋友間難得的團聚，頂級私宴桌菜以粵式桌菜工藝為底蘊，由師傅依宴席需求精心搭配，從前菜、主菜、湯品到甜點，層層鋪陳，道道講究火候與擺盤。


    無需費心搭配，只需從容待客。


    讓每一道菜都成為款待賓客的心意，將體面、講究與情誼，一席之間悉數呈現。
  cta_text: 桌宴洽詢
