<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單點餐品 — 炎香樓 yanxianglou</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%233B0503'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23D9C7A8' font-family='serif'%3E炎%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#14120E;--black2:#1F1B15;--accent:#3B0503;--accent-light:#5A100D;
    --text-warm:#D9C7A8;--muted:#8A8370;--muted-light:#B9AC92;--line:#3A3427;--on-accent:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Serif TC', serif;background:var(--black);color:var(--text-warm);}
  a{color:inherit;text-decoration:none;}
  .eyebrow{font-family:'Oswald', sans-serif;font-size:12px;letter-spacing:0.28em;text-transform:uppercase;color:var(--muted-light);}
  header{padding:16px 48px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .logo-slot{width:100px;height:36px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:'Oswald', sans-serif;font-size:9px;letter-spacing:0.1em;color:var(--muted);}
  header a.back{font-family:'Oswald', sans-serif;font-size:12px;letter-spacing:0.1em;color:var(--muted-light);}

  .page-head{padding:70px 48px 30px;text-align:center;}
  .page-head h1{font-size:32px;font-weight:700;margin:14px 0 12px;}
  .page-head p{font-size:14px;color:var(--muted-light);max-width:520px;margin:0 auto 26px;}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    font-family:'Oswald', sans-serif;font-size:13px;letter-spacing:0.12em;
    padding:13px 26px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);cursor:pointer;
  }
  .btn:hover{background:var(--accent-light);}
  .btn.outline{background:none;border-color:var(--text-warm);color:var(--text-warm);}
  .btn.outline:hover{background:var(--text-warm);color:var(--black);}

  .wrap{max-width:1080px;margin:0 auto 100px;padding:0 48px;}
  .grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;}

  .cell{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--black2);border:1px solid var(--line);cursor:pointer;}
  .cell .frame{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;}
  .cell .frame.active{opacity:1;}
  .cell .frame .bg{position:absolute;inset:0;}

  .cell .caption{
    position:absolute;left:0;right:0;bottom:0;z-index:4;
    padding:18px;
    background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
    transform:translateY(100%);
    transition:transform .4s ease;
  }
  .cell:hover .caption{transform:translateY(0);}
  .cell .caption .main-title{font-size:16px;font-weight:700;color:var(--text-warm);}
  .cell .caption .sub-title{font-family:'Oswald', sans-serif;font-size:11px;letter-spacing:.06em;color:var(--muted-light);margin-top:5px;}

  .cell .dots{position:absolute;top:12px;right:12px;display:flex;gap:5px;z-index:5;}
  .cell .dots span{width:5px;height:5px;border-radius:50%;background:rgba(217,199,168,.4);}
  .cell .dots span.active{background:var(--text-warm);}

  /* 下方保留兩格：banner + CTA */
  .extra-row{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px;}
  .banner-cell{
    background:radial-gradient(circle at 30% 30%, rgba(90,16,13,.4), transparent 55%), linear-gradient(160deg,#241511,#100D0A);
    border:1px solid var(--line);min-height:200px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald', sans-serif;font-size:11px;letter-spacing:.1em;color:var(--muted-light);text-align:center;padding:20px;
  }
  .cta-cell{
    background:var(--black2);border:1px solid var(--line);min-height:200px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;
  }
  .cta-cell .t{font-size:15px;font-weight:500;}
</style>
</head>
<body>

<header>
  <div class="logo-slot">上傳 LOGO</div>
  <a class="back" href="index.html">← 回首頁</a>
</header>

<div class="page-head">
  <span class="eyebrow">À LA CARTE</span>
  <h1>單點餐品</h1>
  <p>每一格滑鼠移入會顯示菜名主副標，並自動輪播多張照片。TODO：實際菜名、價格、照片待補。</p>
  <a class="btn outline" href="assets/menu-alacarte.pdf" target="_blank">查看單點完整菜單 →</a>
</div>

<div class="wrap">
  <div class="grid" id="grid"></div>

  <div class="extra-row">
    <div class="banner-cell">TODO — 橫幅Banner：可放季節限定推薦或活動宣傳圖</div>
    <div class="cta-cell">
      <div class="t">想看更完整的菜色？</div>
      <a class="btn" href="assets/menu-alacarte.pdf" target="_blank">查看完整菜單 →</a>
    </div>
  </div>
</div>

<script>
  // 6格示範資料，之後串接實際菜品照片與主副標文字
  const dishes = Array.from({length:6}).map((_, i) => ({
    main: `TODO 菜名 ${i+1}`,
    sub: 'TODO 副標／食材說明',
    frames: 3
  }));

  const grid = document.getElementById('grid');
  const bgVariants = [
    'radial-gradient(circle at 30% 20%, rgba(90,16,13,.4), transparent 50%), linear-gradient(160deg,#2A1512,#100E0A)',
    'radial-gradient(circle at 70% 30%, rgba(90,16,13,.3), transparent 50%), linear-gradient(160deg,#221310,#0E0C09)',
    'radial-gradient(circle at 50% 70%, rgba(90,16,13,.35), transparent 50%), linear-gradient(160deg,#241511,#100D0A)'
  ];

  dishes.forEach((dish, idx) => {
    const cell = document.createElement('div');
    cell.className = 'cell';

    let framesHtml = '';
    for(let f=0; f<dish.frames; f++){
      framesHtml += `
        <div class="frame ${f===0?'active':''}" data-f="${f}">
          <div class="bg" style="background:${bgVariants[f % bgVariants.length]}"></div>
        </div>`;
    }
    let dotsHtml = '';
    for(let f=0; f<dish.frames; f++){
      dotsHtml += `<span class="${f===0?'active':''}"></span>`;
    }

    cell.innerHTML = framesHtml + `
      <div class="dots">${dotsHtml}</div>
      <div class="caption">
        <div class="main-title">${dish.main}</div>
        <div class="sub-title">${dish.sub}</div>
      </div>`;
    grid.appendChild(cell);

    const frames = cell.querySelectorAll('.frame');
    const dots = cell.querySelectorAll('.dots span');
    let cur = 0;
    let timer = setInterval(next, 2600 + idx*150);

    function next(){
      frames[cur].classList.remove('active');
      dots[cur].classList.remove('active');
      cur = (cur + 1) % frames.length;
      frames[cur].classList.add('active');
      dots[cur].classList.add('active');
    }
    cell.addEventListener('mouseenter', () => clearInterval(timer));
    cell.addEventListener('mouseleave', () => { timer = setInterval(next, 2600); });
  });
</script>
</body>
</html>
